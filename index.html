<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Profile Minimalis</title>
    <style>
      :root {
        --bg-color: #f4f4f9;
        --text-color: #333;
        --card-bg: #ffffff;
        --accent-color: #2c3e50;
        --hover-color: #34495e;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .profile-card {
        background-color: var(--card-bg);
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        padding: 40px 30px;
        text-align: center;
        max-width: 380px;
        width: 100%;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .profile-card:hover {
        transform: translateY(-8px);
      }

      .profile-image {
        width: 130px;
        height: 130px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 20px;
        border: 3px solid transparent;
        box-shadow: 0 0 0 3px var(--accent-color);
        padding: 3px;
      }

      h1 {
        font-size: 1.7rem;
        margin-bottom: 8px;
        color: #111;
        font-weight: 700;
      }

      p.title {
        font-size: 0.9rem;
        color: #7f8c8d;
        margin-bottom: 20px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        font-weight: 600;
      }

      p.bio {
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 30px;
        color: #555;
      }

      .social-links {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .social-links a {
        text-decoration: none;
        color: var(--card-bg);
        background-color: var(--accent-color);
        padding: 10px 24px;
        border-radius: 30px;
        font-size: 0.9rem;
        font-weight: 500;
        transition: all 0.3s ease;
      }

      .social-links a:hover {
        background-color: var(--hover-color);
        box-shadow: 0 5px 15px rgba(44, 62, 80, 0.3);
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="profile-card">
      <img
        src="Logo-Untan-Universitas-Tanjungpura-PNG.png"
        alt="Foto Profil"
        class="profile-image"
      />
      <h1>Nama Anda</h1>
      <p class="title">Web Developer</p>
      <p class="bio">
        Halo! Saya seorang pengembang web yang menyukai desain minimalis dan
        antarmuka yang bersih. Selalu bersemangat mempelajari hal-hal baru.
      </p>

      <div class="social-links">
        <a href="#">Email</a>
        <a href="#">GitHub</a>
        <a href="#">LinkedIn</a>
      </div>
    </div>
  </body>
</html>
